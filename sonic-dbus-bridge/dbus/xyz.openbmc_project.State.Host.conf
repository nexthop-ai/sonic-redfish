<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus policy for sonic-dbus-bridge State.Host service.

  This allows the sonic-dbus-bridge process to own the
  xyz.openbmc_project.State.Host and xyz.openbmc_project.State.Chassis
  service names on the system bus (both served from the same connection)
  and expose the State.Host / State.Chassis interfaces.
-->
<busconfig>

  <!-- Only root can own the State.Host / State.Chassis bus names -->
  <policy user="root">
    <allow own="xyz.openbmc_project.State.Host"/>
    <allow own="xyz.openbmc_project.State.Chassis"/>
    <allow send_destination="xyz.openbmc_project.State.Host"/>
    <allow send_destination="xyz.openbmc_project.State.Chassis"/>
  </policy>

  <!-- Allow all users to call methods on our objects -->
  <policy context="default">
    <allow send_destination="xyz.openbmc_project.State.Host"/>
    <allow receive_sender="xyz.openbmc_project.State.Host"/>
    <allow send_destination="xyz.openbmc_project.State.Chassis"/>
    <allow receive_sender="xyz.openbmc_project.State.Chassis"/>
  </policy>

</busconfig>

